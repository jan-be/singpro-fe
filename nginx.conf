# Detect search engine / social preview bots by User-Agent.
# Bots get prerendered HTML (generated by singpro-be into the shared
# /prerendered volume); humans get the SPA.
map $http_user_agent $is_bot {
    default                     0;
    ~*googlebot                 1;
    # Googlebot Smartphone drops the googlebot token when it renders, so only
    # this 2015 device build gives the render pass away. Without it the render
    # phase gets the SPA shell while the crawl phase gets the prerendered page,
    # and Google indexes a different document than it crawled.
    "~*nexus 5x build/mmb29p"   1;
    ~*bingbot                   1;
    ~*slurp                     1;
    ~*duckduckbot               1;
    ~*baiduspider               1;
    ~*yandexbot                 1;
    ~*facebot                   1;
    ~*facebookexternalhit       1;
    ~*twitterbot                1;
    ~*linkedinbot               1;
    ~*whatsapp                  1;
    ~*telegrambot               1;
    ~*discordbot                1;
    ~*applebot                  1;
    ~*semrushbot                1;
    ~*ahrefsbot                 1;
    ~*mj12bot                   1;
    ~*dotbot                    1;
    ~*rogerbot                  1;
    ~*embedly                   1;
    ~*showyoubot                1;
    ~*outbrain                  1;
    ~*pinterest                 1;
    ~*slackbot                  1;
    ~*vkshare                   1;
    ~*w3c_validator             1;
    ~*petalbot                  1;
    ~*gptbot                    1;
    ~*claudebot                 1;
    ~*bytespider                1;
}

server {
    listen 80;
    root /files;

    # Traefik terminates TLS and proxies here over plain HTTP, so nginx builds
    # its absolute redirects with scheme http — every legacy URL then bounced
    # http://singpro.app/... -> Traefik's redirect-to-https -> https://..., two
    # hops through an insecure one for exactly the URLs search engines still
    # hold. Relative Location headers keep the scheme the client arrived with.
    absolute_redirect off;

    # =====================================================================
    # Legacy URLs → permanent redirects, so search engines consolidate
    # onto the single canonical URL per page.
    # =====================================================================

    # /sing/{slug}/{songId} and /{lang}/sing/{slug}/{songId} → /sing/{songId}
    location ~ "^/(?:[a-z]{2}(?:-[A-Z]{2})?/)?sing/[^/]+/([^/]+)/?$" {
        return 301 /sing/$1$is_args$args;
    }

    # Language is no longer part of page URLs (/{lang}/sing/... → /sing/...).
    # The one exception is the home page, which exists per language so it can
    # rank for each language's searches: /{lang}/ → localised home (bots get the
    # prerendered one). English lives at / itself.
    location ~ "^/en/?$" {
        return 301 /$is_args$args;
    }
    location ~ "^/(de|nl|ja|ko|es|pt|fr|it|tr|zh|zh-TW|th|id|pl|ru|ar|hi|vi|sv|tl)/?$" {
        if ($is_bot) {
            rewrite "^/([^/]+)/?$" /prerendered/$1/index.html last;
        }
        try_files /index.html =404;
    }
    location ~ "^/(?:en|de|nl|ja|ko|es|pt|fr|it|tr|zh|zh-TW|th|id|pl|ru|ar|hi|vi|sv|tl)(/.+)$" {
        return 301 $1$is_args$args;
    }

    # =====================================================================
    # SEO files (written by the backend into the shared volume)
    # =====================================================================
    location = /robots.txt {
        root /;
        try_files /prerendered/robots.txt /files/robots.txt =404;
    }
    location = /sitemap.xml        { alias /prerendered/sitemap-index.xml; }
    location = /sitemap-index.xml  { alias /prerendered/sitemap-index.xml; }
    location ~ "^/sitemap-[0-9]+\.xml$" { root /prerendered; }

    # =====================================================================
    # Pages: bots → prerendered HTML, humans → SPA
    # =====================================================================

    # Home page
    location = / {
        if ($is_bot) {
            rewrite ^/$ /prerendered/index.html last;
        }
        try_files /index.html =404;
    }

    # /sing/none is the "waiting for the host" state of a party — never index
    location = /sing/none {
        add_header X-Robots-Tag "noindex" always;
        try_files /index.html =404;
    }

    # Song pages: /sing/{songId} → /prerendered/sing/{songId}.html for bots
    location ~ "^/sing/([^/]+)/?$" {
        if ($is_bot) {
            rewrite "^/sing/([^/]+)/?$" /prerendered/sing/$1.html last;
        }
        try_files /index.html =404;
    }

    # Ephemeral party routes — never index
    location ~ "^/(?:join|mic)/" {
        add_header X-Robots-Tag "noindex" always;
        try_files /index.html =404;
    }

    # Internal: a bot asked for a song page. Every song in the catalogue has
    # one generated (the indexing ramp only decides noindex and sitemap
    # membership), so a missing file means there is no such song — and song
    # IDs are case-sensitive base62, which is the usual way to arrive here.
    # Answering with the app shell would be a soft 404: 200, no content for
    # that URL, and the home page's title and description on top.
    location /prerendered/sing/ {
        internal;
        root /;
        try_files $uri =404;
    }

    # Internal: the other prerendered files (language home pages). If one is
    # missing (e.g. before the first generation run), fall back to the SPA.
    location /prerendered/ {
        internal;
        root /;
        try_files $uri @spa;
    }
    location @spa {
        try_files /index.html =404;
    }

    # Search engines and older browsers also try /favicon.ico; the PNG logo
    # answers it (the prerendered pages link /logo.png explicitly as well)
    location = /favicon.ico {
        alias /files/logo.png;
        types { }
        default_type image/png;
        expires 7d;
    }

    # =====================================================================
    # Default: static assets + SPA fallback for every other route
    # =====================================================================
    location / {
        index index.html;

        set $fallback_file /index.html;
        if ($http_accept !~ text/html) {
            set $fallback_file /null;
        }
        if ($uri ~ /$) {
            set $fallback_file /null;
        }
        try_files $uri $fallback_file;
    }
}
