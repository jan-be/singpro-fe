<!doctype html>
<title>ort minimal bench</title>
<link rel="icon" href="data:,">
<pre id="log">loading…</pre>
<script type="module">
// window.__run({ rt, n }) starts a fresh worker for one runtime, times it from
// new Worker() until its session is ready, feeds it n windows of the test
// audio (960 samples every 480, as MicrophoneInput does) and returns the
// timings and the raw model outputs (base64 float32).
const WIN = 960, HOP = 480;
const audio = new Float32Array(await (await fetch('/audio.f32')).arrayBuffer());
const maxWindows = Math.floor((audio.length - WIN) / HOP) + 1;
const b64 = (f32) => {
  const u8 = new Uint8Array(f32.buffer, f32.byteOffset, f32.byteLength);
  let s = '';
  for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode(...u8.subarray(i, i + 0x8000));
  return btoa(s);
};
const pct = (a, q) => { const s = [...a].sort((x, y) => x - y); return s[Math.min(s.length - 1, Math.floor(q * s.length))]; };

window.__info = { maxWindows, ua: navigator.userAgent, variants: await (await fetch('/variants.json')).json() };
window.__run = ({ rt, n = maxWindows }) => new Promise((resolve) => {
  n = Math.min(n, maxWindows);
  const tCreate = performance.now();
  const w = new Worker(`/worker.js?rt=${rt}`, { type: 'module' });
  let ready;
  w.onerror = (e) => { w.terminate(); resolve({ rt, error: e.message || 'worker error' }); };
  w.onmessage = ({ data }) => {
    if (data.type === 'error') { w.terminate(); resolve({ rt, error: data.error }); return; }
    if (data.type === 'ready') {
      ready = { initMs: performance.now() - tCreate, importMs: data.importMs, sessionMs: data.sessionMs };
      w.postMessage({ audio, win: WIN, hop: HOP, n });
      return;
    }
    w.terminate();
    resolve({
      rt, n, frames: data.frames, ...ready,
      firstRunMs: data.ms[0],
      meanMs: data.totalMs / n,
      medianMs: pct(data.ms.subarray(1), 0.5),
      p90Ms: pct(data.ms.subarray(1), 0.9),
      pitch: b64(data.pitch), conf: b64(data.conf),
    });
  };
});
document.getElementById('log').textContent = `ready: ${maxWindows} windows; variants ${window.__info.variants.join(', ')}`;
window.__ready = true;
</script>
